name: Validate analysis and real-model preflight
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recorded-results:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"
      - run: python -m pip install -r requirements-analysis.txt
      - run: python -m ssc_geometry verify
      - run: python -m unittest discover -s tests -v
      - run: python -m ssc_geometry reproduce --out outputs/ci_regeneration
  real-model-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONHASHSEED: "0"
      PYTHONPATH: src
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      SSC_REQUIRE_REAL_MODEL: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0+cpu torchvision==0.26.0+cpu
      - run: python -m pip install -r requirements-inference-cpu.txt
      - run: python -m pip check
      - run: python -m ssc_geometry verify
      - run: python scripts/prepare_upstream.py
      - run: python -m unittest discover -s tests -p test_model_loading.py -v
      - run: python scripts/run_singleton_audit.py --mode preflight --device cpu --allow-nonreference-environment --out outputs/ci_preflight
      - run: python scripts/run_singleton_audit.py --mode preflight --device cpu --allow-nonreference-environment --out outputs/ci_preflight --resume
      - name: Check preflight coverage and resume
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report=json.loads(Path('outputs/ci_preflight/conformance_report.json').read_text())
          assert report['status']=='PASS'
          assert (report['sources'],report['candidates'],report['patched_candidates'])==(4,4,4)
          assert report['new_forward_passes_this_invocation']==0
          assert report['complete_canonical_panel'] is False
          PY
