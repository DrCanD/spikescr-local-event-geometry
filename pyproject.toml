[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spikescr-local-event-geometry"
version = "0.1.0rc1"
description = "Auditable finite-neighborhood analysis of a frozen SpikeSCR speech classifier"
requires-python = ">=3.11,<3.14"
authors = [{name = "Ismail Can Dikmen"}]
dependencies = ["numpy==2.3.5", "scipy==1.17.0"]

[project.scripts]
ssc-geometry = "ssc_geometry.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
